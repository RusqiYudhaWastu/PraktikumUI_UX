<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Basic JavaScript</title>
</head>
<body>
    <h2>Praktikum Basic JavaScript</h2>
    <p>Lihat hasil melalui Console Browser (F12).</p>

    <script>
        // ==========================================
        // 2. Output, Variabel, dan Tipe Data
        // ==========================================
        console.log("=== 2. OUTPUT, VARIABEL, DAN TIPE DATA ===");
        const nama = "Rusqiw";
        let umur = 25;
        let nilai = 90;
        let aktif = true;

        console.log("Nama         :", nama);
        console.log("Umur         :", umur);
        console.log("Nilai        :", nilai);
        console.log("Status aktif :", aktif);
        console.log("Tipe nilai   :", typeof nilai);
        console.log("");

        // ==========================================
        // 3. Operator dan Perhitungan Sederhana
        // ==========================================
        console.log("=== 3. OPERATOR DAN PERHITUNGAN SEDERHANA ===");
        const tugas = 80;
        const uts = 90;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("Nilai Akhir  :", akhir);
        console.log("Lulus        :", akhir >= 60);
        console.log("");

        // ==========================================
        // 4. Percabangan if, else if, else
        // ==========================================
        console.log("=== 4. PERCABANGAN IF, ELSE IF, ELSE ===");
        const nilai1 = 90;
        let kategori;

        if (nilai1 >= 90) {
            kategori = "A";
        } else if (nilai1 >= 80) {
            kategori = "B";
        } else if (nilai1 >= 70) {
            kategori = "C";
        } else if (nilai1 >= 60) {
            kategori = "D";
        } else {
            kategori = "E";
        }

        console.log("Nilai Akhir  :", nilai1);
        console.log("Kategori     :", kategori);
        console.log("");

        // ==========================================
        // 5. Perulangan dan Fungsi Dasar
        // ==========================================
        console.log("=== 5. PERULANGAN DAN FUNGSI DASAR ===");
        function hitungDiskon(harga, persen) {
            return harga - (harga * persen / 100);
        }

        for (let i = 0; i <= 3; i++) {
            const harga = i * 100000;
            const bayar = hitungDiskon(harga, 10);
            console.log("Barang", i, "| Harga:", harga, "| Bayar:", bayar);
        }
    </script>
</body>
</html>
