
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout web menggunakan frameset</title>
</head>

    <frameset rows="100, *, 50" frameborder="1" border="1" framespacing="1">
        <frame src="header.html" name="headerframe" scrolling="no">

        <frameset cols="20%, 80%" frameborder="1" border="1" framespacing="1">
            <frame src="sidebar.html" name="sidebarframe" scrolling="no">
            <frame src="main.html" name="showframe" scrolling="">
        </frameset>
<frame src="footer.html" name="footerframe" scrolling="no">
    </frameset>

</html>
