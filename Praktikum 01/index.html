<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
</head>

<body>

    <!-- Student Information -->
    <h1>Student Information</h1>
    <p>Kampus STTNF</p>

    <div>
        <img src="assets/img/wowok.jpg" alt="STTNF Logo" width="200">
    </div>
    <!-- List -->
    <h2>Student List</h2>

    <ol>
        <li>Tedy</li>
        <li>Putin</li>
        <li>Dominic</li>
    </ol>


    <!-- Table -->
    <h2>Student Data</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Major</th>
        </tr>
        <tr>
            <td>Tedy</td>
            <td>20</td>
            <td>Computer Science</td>
        </tr>
        <tr>
            <td>Putin</td>
            <td>21</td>
            <td>Electrical Engineering</td>
        </tr>
        <tr>
            <td>Dominic</td>
            <td>22</td>
            <td>Mechanical Engineering</td>
        </tr>
    </table>

    <!-- Form -->
    <h2>Student Form</h2>

    <form action="/submit" method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="umur">Age:</label>
        <input type="number" id="umur" name="umur" required>
        <br><br>
        <label for="message">Message:</label>
        <br>
        <textarea
            id="message"
            name="message"
            rows="4"
            cols="50"
            required
        ></textarea>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
